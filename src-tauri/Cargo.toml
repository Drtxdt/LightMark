[package]
name = "lightmark"
version = "0.1.0"
description = "LightMark desktop Markdown editor"
authors = ["LightMark"]
edition = "2021"
default-run = "lightmark"

[lib]
name = "lightmark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
rfd = "0.15"
regex = "1"
notify = "8"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
serde_yaml = "0.9"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }
image = { version = "0.25", default-features = false, features = ["png"] }
resvg = { version = "0.45", default-features = true }
clap = { version = "4", features = ["derive"] }

[[bin]]
name = "lightmark"
path = "src/main.rs"

[[bin]]
name = "lightmark-cli"
path = "src/bin/lightmark-cli.rs"
