[package]
name = "lightmark"
version = "0.1.0"
description = "LightMark desktop Markdown editor"
authors = ["LightMark"]
edition = "2021"

[lib]
name = "lightmark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
rfd = "0.15"

