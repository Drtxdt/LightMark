name: Desktop document opening
on:
  push:
    branches: [codex/desktop-open-ime]
  pull_request:
    paths: ['src-tauri/**', 'src/App.vue', 'scripts/qa/desktop-*', '.github/workflows/desktop-open.yml']
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: 1.94.1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - run: rustup toolchain install 1.94.1 --profile minimal
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: runner.os == 'Windows'
        run: pnpm exec tauri build --bundles nsis
      - if: runner.os == 'macOS'
        run: |
          pnpm exec tauri build --bundles app
          ditto -c -k --sequesterRsrc --keepParent src-tauri/target/release/bundle/macos/LightMark.app LightMark-mac.zip
          shasum -a 256 LightMark-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: LightMark-${{ runner.os }}-${{ github.sha }}
          path: |
            LightMark-mac.zip
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - if: runner.os == 'Windows'
        run: ./scripts/qa/desktop-open.ps1
      - if: runner.os == 'macOS'
        run: bash scripts/qa/desktop-open-mac.sh
