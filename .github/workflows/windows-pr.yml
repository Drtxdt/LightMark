name: Windows checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  editor:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4; version in package.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check editing integrity first
        run: pnpm check:wysiwyg-find
      - run: pnpm build
      - name: Run all repository checks against the production bundle
        run: node scripts/check-all.mjs --output .cache/pr-checks
      - name: Keep failed check diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-pr-checks
          path: .cache/pr-checks/checks/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  native:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.94.1 --profile minimal
      - name: Test Windows file operations and CLI
        run: cargo +1.94.1 test --manifest-path src-tauri/Cargo.toml --locked
